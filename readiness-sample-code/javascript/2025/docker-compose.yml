services:
  ua-javascript-libraries:
    container_name: ua-javascript-libraries
    image: ua-javascript-libraries
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
  greenmail:
    container_name: greenmail
    image: greenmail/standalone:latest
    ports:
      - "3025:3025"
      - "3143:3143"
    environment:
      GREENMAIL_USERS: password:test@localhost
